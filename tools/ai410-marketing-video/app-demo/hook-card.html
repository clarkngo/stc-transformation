<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI 410 app demo: opening card</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: #002D5C; color: #FFFFFF; font-family: "Open Sans", Calibri, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 0 120px; gap: 28px; }
  .eyebrow { font-size: 24px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; opacity: .8; }
  h1 { font-size: 74px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; max-width: 980px; }
  .bar { width: 120px; height: 8px; background: #F63E02; border-radius: 4px; }
  p { font-size: 30px; font-weight: 600; opacity: .9; }
</style>
</head>
<body>
  <div class="eyebrow">AI 410: AI Engineering</div>
  <h1>After AI 410, this is what you can build with AI.</h1>
  <div class="bar"></div>
  <p>A real app, running live.</p>
</body>
</html>
