<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI 410 app demo: phone stage</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* Served from the Expo dev server (copied into mobile/public by the recorder),
     so the phone app in the frame is same-origin and its screen can be read. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: #002D5C; font-family: "Open Sans", Calibri, sans-serif; display: flex; align-items: center; justify-content: center; gap: 90px; }
  .phone { width: 372px; height: 664px; background: #0b0f14; border-radius: 48px; padding: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  iframe { width: 340px; height: 632px; border: 0; border-radius: 34px; background: #f7fafc; display: block; }
  .side { color: #fff; max-width: 430px; }
  .side b { display: block; font-size: 20px; letter-spacing: 3px; text-transform: uppercase; color: #F63E02; margin-bottom: 14px; }
  .side h2 { font-size: 46px; font-weight: 800; line-height: 1.15; }
</style>
</head>
<body>
  <div class="phone"><iframe src="/" title="AI 410 phone app"></iframe></div>
  <div class="side"><b>Unit 4</b><h2>The same app, on a phone.</h2></div>
</body>
</html>
