<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI 410 app demo: the four units</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: #FFFFFF; color: #002D5C; font-family: "Open Sans", Calibri, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 0 120px; gap: 34px; }
  h1 { font-size: 52px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15; }
  ol { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  li { border-top: 8px solid #F63E02; background: #F2F5F8; border-radius: 0 0 12px 12px; padding: 20px 18px 22px; }
  li b { display: block; font-size: 20px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #F63E02; margin-bottom: 8px; }
  li span { font-size: 25px; font-weight: 600; line-height: 1.3; }
  p { font-size: 26px; font-weight: 600; color: #3A5675; }
</style>
</head>
<body>
  <h1>You build every piece, one two-week unit at a time.</h1>
  <ol>
    <li><b>Unit 1</b><span>The agent loop and tools</span></li>
    <li><b>Unit 2</b><span>Answers from your documents</span></li>
    <li><b>Unit 3</b><span>Guardrails and background jobs</span></li>
    <li><b>Unit 4</b><span>A phone app and tracing</span></li>
  </ol>
  <p>Then your team builds an app of its own in the Term Project.</p>
</body>
</html>
