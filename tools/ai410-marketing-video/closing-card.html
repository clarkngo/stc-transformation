<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI 410 video closing card</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: #FFFFFF; color: #002D5C; font-family: "Open Sans", Calibri, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 0 120px; gap: 28px; }
  img { height: 78px; width: auto; align-self: flex-start; }
  h1 { font-size: 68px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
  .bar { width: 120px; height: 8px; background: #F63E02; border-radius: 4px; }
  p { font-size: 32px; font-weight: 600; }
  .link { font-size: 30px; font-weight: 600; border-bottom: 4px solid #F63E02; align-self: flex-start; padding-bottom: 4px; }
</style>
</head>
<body>
  <img src="../../assets/cityu-logo.png" alt="City University of Seattle">
  <h1>AI 410: AI Engineering</h1>
  <div class="bar"></div>
  <p>BS in AI · City University of Seattle</p>
  <span class="link">cityuseattle.github.io/ai410</span>
</body>
</html>
